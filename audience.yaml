# 분야를 바꿀 때는 이 파일만 고치면 됩니다. graph.py는 손댈 필요 없어요.
# TOP10 차트(박스오피스·OTT)는 실제 순위 데이터라 이 파일과 무관하게 charts.py가 따로 가져옵니다.

독자:
  누구: "영화·드라마를 기획하고 제작하는 프로덕션 팀 — PD, 제작사 대표, 편집자"
  이미_아는_것: "투자·배급 구조, OTT 편성 관행, 제작 예산·일정 관리"

# 본선 프롬프트에 그대로 들어간다. 위에 있을수록 우선.
# 기사 하나를 보고 예/아니오로 답할 수 있는 질문이어야 한다.
중요도_기준:
  - "앞으로의 시장 흐름(투자·배급·편성)이 바뀔 만한 전망을 담고 있는가"
  - "유튜브 같은 온라인 동영상 플랫폼이 영화·드라마 시장과 경쟁하거나 협력하는 소식인가"
  - "원작(웹툰·소설·게임 등)의 2차 판권(리메이크·MD·라이선싱)으로 실제 수익을 낸 구체적 사례인가"

# 추상어("홍보성") 말고 구체적인 표현으로.
버릴_것:
  - "단순 캐스팅·티저 공개처럼 제작 방식에 영향 없는 소식"
  - "시상식 수상·MOU 체결 등 당사자 홍보성 소식"

# 색상은 디스코드 임베드 테두리에 쓰인다. #RRGGBB 형식.
토픽:
  - 이름: "시장 전망"
    색상: "#0B6E77"
    데스크지침: "투자 규모·배급 방식·편성 변화를 숫자로 적을 것"
  - 이름: "유튜브·영상 플랫폼"
    색상: "#4C7C9C"
    데스크지침: "유튜브·숏폼 등이 극장·OTT와 어떻게 경쟁·협력하는지 구체적으로"
  - 이름: "2차 IP·라이선싱"
    색상: "#8F5606"
    데스크지침: "수익 규모(금액)와 어떤 방식(MD·리메이크·테마파크 등)으로 냈는지 반드시 숫자로"

